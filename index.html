<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
</head>
<body>
<title>Be My Valentine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  /* Layout: one centered column. Chibi doe on top, question, then YES grows while NO shrinks beneath it. */
  :root {
    --bg: #fde9ec;
    --fg: #4a1424;
    --muted: #8a4a5a;
    --heart: #e0405f;
    --heart-deep: #b02444;
    --yes: #e0405f;
    --yes-fg: #ffffff;
    --no-bg: #f6cfd6;
    --no-fg: #6e2a3c;
    --tear: #6fb4e8;
    --hoodie: #1c1c22;
    --k-hair: #1f1e27;
    --k-skin: #f6d9bc;
    --k-mask: #f6c6d1;
    --k-ink: #5b3b33;
    --fur: #f2b077;
    --fur-light: #fff0dc;
    --iris: #4a9d78;
    --hair: #6a3b2c;
    --ear-in: #f4a3ad;
    --blush: #ff8fa3;
    --eye: #3b2118;
    --eye-white: #ffffff;
    --font-display: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
    --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2a0f1a; --fg: #ffe6ea; --muted: #d99aa9;
      --heart: #ff5c7c; --heart-deep: #d63a5b;
      --yes: #ff5c7c; --yes-fg: #2a0f1a; --no-bg: #4a2030; --no-fg: #f6cfd6;
      --tear: #7cc2f2; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #2a0f1a; --fg: #ffe6ea; --muted: #d99aa9;
    --heart: #ff5c7c; --heart-deep: #d63a5b;
    --yes: #ff5c7c; --yes-fg: #2a0f1a; --no-bg: #4a2030; --no-fg: #f6cfd6;
    --tear: #7cc2f2; color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    padding-inline: 16px;
    overflow-x: hidden;
  }
  main {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    padding-block: 24px;
    max-width: 560px;
    margin-inline: auto;
  }
  h1 {
    font-family: var(--font-display);
    font-size: clamp(2.4rem, 11vw, 4rem);
    line-height: 1.05;
    margin: 0;
    text-wrap: balance;
  }
  .caption {
    min-height: 1.6em;
    margin: 0;
    color: var(--muted);
    font-weight: 600;
    font-size: 1.05rem;
  }

  /* Photo layout: picture fills the column behind the text, edges fade into the page */
  [hidden] { display: none !important; }
  main { position: relative; }
  main.has-photo { justify-content: flex-end; min-height: max(100%, 600px); padding-block: 24px 40px; }
  main > h1, main > #ask, main > .answers { position: relative; z-index: 1; }
  .photo {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(100%, 520px);
    height: 100%;
    object-fit: cover;
    object-position: top center;
    z-index: 0;
    -webkit-mask-image: radial-gradient(ellipse closest-side at 50% 50%, #000 62%, transparent 100%);
    mask-image: radial-gradient(ellipse closest-side at 50% 50%, #000 62%, transparent 100%);
    transition: filter .4s ease;
  }
  .photo.win { animation: pop .9s ease-out; }
  @keyframes pop { 0% { transform: translateX(-50%) scale(1); } 40% { transform: translateX(-50%) scale(1.04); } 100% { transform: translateX(-50%) scale(1); } }
  main.has-photo h1 { text-shadow: 0 0 14px var(--bg), 0 0 6px var(--bg), 0 0 2px var(--bg); }
  main.has-photo .caption { text-shadow: 0 0 10px var(--bg), 0 0 4px var(--bg); }

  /* Little storybook me, reacting to every NO */
  .buddy { display: flex; align-items: flex-end; justify-content: center; gap: 12px; max-width: 100%; }
  .kid { width: 132px; height: auto; flex: none; overflow: visible; filter: drop-shadow(0 3px 3px rgba(0,0,0,.22)); }
  .bubble {
    margin: 0; min-width: 0; flex: 0 1 240px; text-align: left;
    background: var(--no-bg); color: var(--no-fg);
    font-weight: 800; font-size: 1.05rem; line-height: 1.3;
    padding: .7em 1em; border-radius: 18px; position: relative; margin-bottom: 38px;
  }
  .bubble::before {
    content: ""; position: absolute; left: -8px; bottom: 16px;
    border: 8px solid transparent; border-left: 0; border-right-color: var(--no-bg);
  }
  .kid .hoodie { fill: var(--hoodie); }
  .kid .hood-line { fill: none; stroke: #4a4858; stroke-width: 2.4; stroke-linecap: round; }
  .kid .string { fill: none; stroke: #d9d6e2; stroke-width: 2; stroke-linecap: round; }
  .kid .k-skin { fill: var(--k-skin); stroke: var(--k-ink); stroke-width: 1.8; }
  .kid .k-hair { fill: var(--k-hair); }
  .kid .mask { fill: var(--k-mask); stroke: var(--k-ink); stroke-width: 1.8; stroke-linejoin: round; }
  .kid .mask-line { fill: none; stroke: #e39bab; stroke-width: 1.6; stroke-linecap: round; }
  .kid .mouth-k { fill: #c25a5a; stroke: var(--k-ink); stroke-width: 1.6; stroke-linejoin: round; }
  .kid .brow-k { fill: none; stroke: var(--k-hair); stroke-width: 3.2; stroke-linecap: round; }
  .kid .eye-k { fill: var(--k-hair); }
  .kid .shine { fill: #fff; }
  .kid .happy-k { fill: none; stroke: var(--k-ink); stroke-width: 2.8; stroke-linecap: round; }
  .kid .k-blush { fill: #ff9aa8; opacity: .6; }
  .kid .sleeve { fill: none; stroke: var(--hoodie); stroke-width: 17; stroke-linecap: round; }
  .kid .fingers-o { fill: none; stroke: var(--k-ink); stroke-width: 10; stroke-linecap: round; }
  .kid .fingers { fill: none; stroke: var(--k-skin); stroke-width: 6.4; stroke-linecap: round; }
  .kid .sweat { fill: var(--tear); stroke: var(--k-ink); stroke-width: 1.2; }
  .kid .k-tear { fill: var(--tear); }
  .kid .arms-peace, .kid .arms-down, .kid .arms-cry, .kid .k-eyes-happy, .kid .sweat, .kid .k-blush, .kid .k-tear { display: none; }
  .kid.s0 .arms-peace, .kid.win .arms-peace { display: inline; }
  .kid.s1 .arms-down, .kid.s1 .sweat { display: inline; }
  .kid.s2 .arms-cry, .kid.s2 .k-tear { display: inline; }
  .kid.s2 .k-tear { animation: drip 1.1s ease-in infinite; }
  .kid.s2 .k-tear.b { animation-delay: .4s; }
  .kid.win .k-eyes { display: none; }
  .kid.win .k-eyes-happy, .kid.win .k-blush { display: inline; }
  .kid .k-mask { transition: transform .3s ease; }
  .kid.win .k-mask { transform: translateY(26px); }
  .kid.s2 { animation: sob .8s ease-in-out infinite; transform-origin: 50% 100%; }
  .kid.win { animation: jump .6s ease-in-out 4; transform-origin: 50% 100%; }
  @keyframes sob { 0%,100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(3px) rotate(1.5deg); } }
  @keyframes jump { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  @media (prefers-reduced-motion: reduce) { .kid.s2, .kid.win, .kid.s2 .k-tear { animation: none; } }

  .kid .suit { fill: var(--hoodie); }
  .kid .shirt { fill: #fff; stroke: #cfcfd8; stroke-width: 1.2; stroke-linejoin: round; }
  .kid .lapel { fill: none; stroke: #3b3b49; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .kid .glass { fill: #a9c4c2; fill-opacity: .35; stroke: #1d1f26; stroke-width: 3.2; }
  .kid .glass-line { fill: none; stroke: #1d1f26; stroke-width: 3; stroke-linecap: round; }
  .kid .nose-k { fill: none; stroke: var(--k-ink); stroke-width: 1.6; stroke-linecap: round; }
  .kid .mouth-line { fill: none; stroke: var(--k-ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .kid .hair-hl { fill: none; stroke: #4a4960; stroke-width: 2; stroke-linecap: round; }
  .kid .mouth-k { display: none; }
  .kid.win .mouth-k { display: inline; }
  .kid.win .mouth-line { display: none; }

  .kid .tie { fill: #7a2434; stroke: #4e1420; stroke-width: 1; stroke-linejoin: round; }
  .kid .lash { fill: none; stroke: var(--k-hair); stroke-width: 2.6; stroke-linecap: round; }
  .kid .glare { fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; opacity: .7; }

  .kid .brow-k { stroke-width: 3.8; }
  .kid .glass { fill: #8fa8a3; fill-opacity: .32; stroke: #14181c; stroke-width: 4.4; }
  .kid .glass-line { stroke: #14181c; stroke-width: 4; }
  .kid .collar { fill: #2c4180; stroke: #16213f; stroke-width: 1.2; stroke-linejoin: round; }
  .kid .placket { fill: none; stroke: #16213f; stroke-width: 2; }
  .kid .btn { fill: #c8d2f0; }

  .kid .shirt-b { fill: #2b2b34; stroke: #484856; stroke-width: 1.2; stroke-linejoin: round; }
  .kid .tie-b { fill: #0e0e12; stroke: #3a3a46; stroke-width: 1; stroke-linejoin: round; }
  .kid .lapel-b { fill: none; stroke: #4a4a58; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .kid .glass { fill: #cfe0ea; fill-opacity: .22; stroke: #3a2418; stroke-width: 4; }
  .kid .glass-line { stroke: #3a2418; stroke-width: 3.6; }

  .kid .strand { fill: none; stroke: var(--k-hair); stroke-width: 2.6; stroke-linecap: round; }
  .kid .hair-hl { stroke-width: 1.6; stroke: #5a5972; }

  /* Chibi cat (shown only when no photo is found) */
  .deer { width: min(58vw, 230px); height: auto; overflow: visible; animation: bob 2.4s ease-in-out infinite; }
  .deer.sad { animation-duration: 4s; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .fur { fill: var(--fur); }
  .fur-light { fill: var(--fur-light); }
  .hair { fill: var(--hair); }
  .ear-in { fill: var(--ear-in); }
  .blush { fill: var(--blush); opacity: .55; }
  .dress { fill: var(--heart); }
  .white { fill: var(--eye-white); }
  .iris { fill: var(--iris); }
  .pupil { fill: var(--eye); }
  .ear-tri { stroke: var(--fur); stroke-width: 8; stroke-linejoin: round; }
  .ear-tri-in { stroke: var(--ear-in); stroke-width: 4; stroke-linejoin: round; }
  .whisker { fill: none; stroke: var(--eye); stroke-width: 2; stroke-linecap: round; opacity: .55; }
  .nose-cat { fill: #ff7f94; stroke: #ff7f94; stroke-width: 2; stroke-linejoin: round; }
  .nose { fill: var(--eye); }
  .line { fill: none; stroke: var(--eye); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .brow { fill: none; stroke: var(--hair); stroke-width: 3.6; stroke-linecap: round; }
  .petal { fill: #ffc2cf; }
  .core { fill: #ffd86b; }
  .tear { fill: var(--tear); opacity: 0; }
  .deer.sad .tear { opacity: .95; animation: drip 1.4s ease-in infinite; }
  .deer.sad .tear.b { animation-delay: .5s; }
  @keyframes drip { 0% { transform: translateY(0); opacity: .95; } 100% { transform: translateY(30px); opacity: 0; } }
  .ear-l, .ear-r { transform-box: fill-box; transform-origin: 50% 90%; animation: twitch 5s ease-in-out infinite; }
  .ear-r { animation-delay: 1.3s; }
  @keyframes twitch { 0%,88%,100% { transform: rotate(0); } 92% { transform: rotate(-8deg); } 96% { transform: rotate(3deg); } }
  .eyes-happy { display: none; }
  .deer.win .eyes { display: none; }
  .deer.win .eyes-happy { display: inline; }
  .deer.win .mouth-open { display: inline; }
  .deer.win .mouth { display: none; }
  .mouth-open { display: none; fill: #b02444; stroke: var(--eye); stroke-width: 3; stroke-linejoin: round; }

  .answers {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
  }
  button {
    font-family: var(--font-body);
    font-weight: 800;
    border: 0;
    cursor: pointer;
    border-radius: 999px;
    max-width: 100%;
    transition: font-size .25s ease, padding .25s ease, transform .1s ease;
  }
  button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  button:active { transform: scale(.97); }
  #yes {
    background: var(--yes);
    color: var(--yes-fg);
    font-size: 1.3rem;
    padding: .55em 1.6em;
    box-shadow: 0 6px 0 var(--heart-deep);
  }
  #no {
    background: var(--no-bg);
    color: var(--no-fg);
    font-size: 1rem;
    padding: .6em 1.4em;
  }

  .win-box { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .win-box p { margin: 0; color: var(--muted); font-weight: 600; font-size: 1.1rem; }
  .float-heart {
    position: fixed;
    bottom: -40px;
    width: 26px; height: 24px;
    pointer-events: none;
    animation: rise linear forwards;
    color: var(--heart);
  }
  @keyframes rise { to { transform: translateY(-115vh) rotate(25deg); opacity: .2; } }
  @media (prefers-reduced-motion: reduce) {
    .deer, .deer.sad, .deer.sad .tear, .ear-l, .ear-r { animation: none; }
    .float-heart { display: none; }
    button { transition: none; }
  }
</style>

      <path class="brow-k" id="kbL" d="M54 76 Q62 73 71 75"/>
      <path class="brow-k" id="kbR" d="M89 75 Q98 73 106 76"/>
      <ellipse class="k-blush" cx="52" cy="108" rx="8" ry="5"/>
      <ellipse class="k-blush" cx="108" cy="108" rx="8" ry="5"/>
      <path class="sweat" d="M132 56 Q127 66 132 71 Q137 66 132 56 Z"/>
      <ellipse class="k-tear a" cx="62" cy="108" rx="3" ry="4.5"/>
      <ellipse class="k-tear b" cx="98" cy="108" rx="3" ry="4.5"/>
      <g class="arms-peace">
        <path class="sleeve" d="M122 158 Q148 146 144 116"/>
        <path class="fingers-o" d="M141 98 L137 82 M148 98 L152 82"/>
        <circle class="k-skin" cx="144" cy="106" r="9"/>
        <path class="fingers" d="M141 98 L137 82 M148 98 L152 82"/>
        <path class="sleeve" d="M36 158 Q26 178 32 196"/>
        <circle class="k-skin" cx="32" cy="198" r="8"/>

      <g class="arms-down">
        <path class="sleeve" d="M36 158 Q26 178 32 196"/>

      </g>
      <g class="arms-cry">
        <path class="sleeve" d="M38 160 Q16 130 58 102"/>
        <circle class="k-skin" cx="60" cy="98" r="9.5"/>
        <path class="sleeve" d="M122 160 Q144 130 102 102"/>
        <circle class="k-skin" cx="100" cy="98" r="9.5"/>
      </g>
    </svg>
    <p class="bubble" id="caption" aria-live="polite">Тийм гэж хэлээч!</p>
  </div>

  <div class="answers" id="answers">
    <button id="yes" type="button">ТИЙМ</button>
    <button id="no" type="button">ҮГҮЙ</button>
  </div>
</main>

<script src="text.js"></script>
<script>
  var TEXT = window.TEXT || {
  pageTitle: "Валентин",
  title: "Чи миний Валентин байх уу?",
  yes: "ТИЙМ",

  // NO товч дээрх бичиг (дарах бүрт солигдоно)
  no: [
    "ҮГҮЙ", "Яагаад үгүй гэж?", "Үнэхээр үү?", "Итгэлтэй байна уу?",
    "Би үнэхээр гунигтай байна...", "Өө үгүй ээ", "Гуйя?", "Би уйлчихна...",
    "Дахиад бодооч", "Гуйя гуйя", "Чи миний зүрхийг шархлуулж байна", "Сүүлийн боломж..."
  ],

  // Жижиг дүрийн яриан бөмбөлөг доторх бичиг
  captions: [
    "Тийм гэж хэлээч!", "Яагаад вэ?", "Энэ царайг хараач.", "Ганц секунд бодооч.",
    "Зүрх минь жаахан эмтэрч байна.", "Өө үгүй ээ...", "Би сайн хүү байна гэж амлаж байна.",
    "Би уйлчихлаа.", "ТИЙМ товч яг энд байна.", "Улам томорч байна шүү.",
    "Тийм гэх нь илүү амархан шүү дээ.", "За тэгээд ТИЙМ дараарай."
  ],

  // ТИЙМ дарсны дараа гарах бичиг
  winTitle: "Ураа! Би мэдэж байсан!",
  winSub: "Валентины өдөр уулзъя.",
  winBubble: "Ураа!! Баярлалаа!"
};
  var noLabels = TEXT.no;
  var captions = TEXT.captions;
  var mouths = {
    happy: "M90 135 Q95 143 100 135 Q105 143 110 135",
    flat: "M91 139 Q96 137 100 133 Q104 137 109 139",
    sad: "M90 142 Q95 134 100 139 Q105 134 110 142"
  };
  var brows = {
    happy: ["M62 88 Q74 83 86 88", "M114 88 Q126 83 138 88"],
    flat: ["M62 88 L86 88", "M114 88 L138 88"],
    sad: ["M62 92 Q74 88 86 80", "M114 80 Q126 88 138 92"]
  };
  var n = 0;
  var yes = document.getElementById("yes");
  var no = document.getElementById("no");
  var deer = document.getElementById("deer");
  var mouth = document.getElementById("mouth");
  var browL = document.getElementById("browL");
  var browR = document.getElementById("browR");
  var irisL = document.getElementById("irisL");
  var irisR = document.getElementById("irisR");
  var caption = document.getElementById("caption");
  var kid = document.getElementById("kid");
  var kbL = document.getElementById("kbL");
  var kbR = document.getElementById("kbR");
  var kMouth = document.getElementById("kMouth");

  /* Looks for photo.jpg next to this page; falls back to the cat if none is found */
  var stage = document.getElementById("stage");
  var photo = document.getElementById("photo");
  var photoSrcs = ["photo.jpg", "photo.jpeg", "photo.png", "photo.webp"];
  var photoIdx = 0;
  photo.addEventListener("error", function () {
    photoIdx += 1;
    if (photoIdx < photoSrcs.length) {
      photo.src = photoSrcs[photoIdx];
    } else {
      photo.remove();
      photo = null;
      stage.classList.remove("has-photo");
      deer.hidden = false;
    }
  });

  function setMood(m) {
    mouth.setAttribute("d", mouths[m]);
    browL.setAttribute("d", brows[m][0]);
    browR.setAttribute("d", brows[m][1]);
    var dy = m === "sad" ? 114 : 111;
    [irisL, irisR].concat(Array.prototype.slice.call(document.querySelectorAll(".pupil"))).forEach(function (e) {
      e.setAttribute("cy", dy);
    });
  }

  function render() {
    var yesSize = Math.min(1.3 + n * 0.7, 7);
    yes.style.fontSize = "min(" + yesSize + "rem, 16vw)";
    var noSize = Math.max(1 * Math.pow(0.84, n), 0.25);
    no.style.fontSize = noSize + "rem";
    no.textContent = noLabels[Math.min(n, noLabels.length - 1)];
    caption.textContent = captions[Math.min(n, captions.length - 1)] || " ";
    setMood(n === 0 ? "happy" : n < 3 ? "flat" : "sad");
    deer.classList.toggle("sad", n >= 4);
    kid.setAttribute("class", "kid " + (n === 0 ? "s0" : n < 4 ? "s1" : "s2"));
    kbL.setAttribute("d", n === 0 ? "M54 76 Q62 73 71 75" : "M54 79 Q62 76 71 70");
    kbR.setAttribute("d", n === 0 ? "M89 75 Q98 73 106 76" : "M89 70 Q98 76 106 79");
    kMouth.setAttribute("d", n === 0 ? "M70 112 Q80 120 90 112" : n < 4 ? "M71 116 Q80 111 89 116" : "M69 119 Q75 111 80 114 Q85 111 91 119");
    if (photo) {
      photo.style.filter = "saturate(" + Math.max(1 - n * 0.08, 0.15) + ") brightness(" + Math.max(1 - n * 0.04, 0.6) + ")";
    }
    if (n >= noLabels.length) { no.hidden = true; }
  }

  no.addEventListener("click", function () {
    n += 1;
    render();
  });

  function floatHearts() {
    for (var i = 0; i < 28; i++) {
      var el = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      el.setAttribute("viewBox", "0 0 120 112");
      el.setAttribute("class", "float-heart");
      el.innerHTML = '<path fill="currentColor" d="M60 104 C20 74 6 52 6 34 C6 17 19 6 33 6 C45 6 55 12 60 23 C65 12 75 6 87 6 C101 6 114 17 114 34 C114 52 100 74 60 104Z"/>';
      el.style.left = Math.random() * 100 + "vw";
      var s = 0.6 + Math.random() * 1.4;
      el.style.width = 26 * s + "px";
      el.style.height = 24 * s + "px";
      el.style.animationDuration = 3 + Math.random() * 4 + "s";
      el.style.animationDelay = Math.random() * 1.5 + "s";
      document.body.appendChild(el);
    }
  }

  yes.addEventListener("click", function () {
    document.getElementById("ask").innerHTML =
      '<div class="win-box"><h1></h1><p></p></div>';
    document.querySelector(".win-box h1").textContent = TEXT.winTitle;
    document.querySelector(".win-box p").textContent = TEXT.winSub;
    document.getElementById("answers").hidden = true;
    deer.classList.remove("sad");
    deer.classList.add("win");
    kid.setAttribute("class", "kid win");
    kbL.setAttribute("d", "M54 74 Q62 70 71 73");
    kbR.setAttribute("d", "M89 73 Q98 70 106 74");
    caption.textContent = TEXT.winBubble;
    if (photo) {
      photo.style.filter = "none";
      photo.classList.add("win");
    }
    setMood("happy");
    browL.setAttribute("d", "M62 90 Q74 82 86 88");
    browR.setAttribute("d", "M114 88 Q126 82 138 90");
    floatHearts();
  });

  document.title = TEXT.pageTitle;
  document.getElementById("title").textContent = TEXT.title;
  yes.textContent = TEXT.yes;
  render();
</script>

</body>
</html>
